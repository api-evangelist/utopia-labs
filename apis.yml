name: Utopia Labs
description: >-
  Utopia Labs was a stablecoin payments and finance-operations platform for
  crypto-native teams and DAOs, covering payments, payroll, invoicing, and
  approval workflows, backed by Paradigm. Coinbase acquired Utopia Labs Corp.
  on November 13, 2024, and the team joined Base to build onchain payments
  into Coinbase Wallet. The company no longer operates independently and
  publishes no public API surface — utopialabs.com returns 404 and its former
  docs, api, and app subdomains no longer resolve.
